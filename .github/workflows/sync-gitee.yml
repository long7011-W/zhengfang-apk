name: Repair optional Gitee APK attachment
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '既有正式版本；仅补传附件，不构建、不修改版本提示'
        required: true
        default: v1.0.97
permissions:
  contents: read
concurrency:
  group: gitee-attachment-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  attachment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Repair existing APK attachment within three minutes
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: python3 scripts/repair_delivery.py --tag "$TAG" --target gitee-attachment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitee-attachment-report
          path: |
            repair/report.json
            repair/report.json.timings.json
          retention-days: 7
      - if: always()
        env:
          RESULT: ${{ job.status }}
        run: echo "Optional Gitee APK attachment $RESULT. Build and version metadata are independent." >> "$GITHUB_STEP_SUMMARY"
