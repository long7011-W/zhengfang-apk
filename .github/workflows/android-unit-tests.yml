name: Android Unit Tests
run-name: 单元测试 · ${{ github.ref_name }}@${{ github.sha }}

# 这是唯一会在 push / PR 上自动跑的检查：只跑 JVM 单测，不碰签名与发布凭据。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      # compileSdk 是 android-37.0：运行镜像里的平台不一定有，先补齐（已装则原样通过）。
      - name: Ensure the compile SDK platform
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" > /dev/null \
            || "$SDKMANAGER" --channel=3 "platforms;android-37.0" > /dev/null
          "$SDKMANAGER" --list_installed | grep -E "platforms;android-(34|37)" || true
      - name: Run unit tests and assemble the debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-parallel --max-workers=2 --console=plain
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 7
      - name: Summarize
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "JVM unit tests + debug APK: $RESULT (\`./gradlew :app:testDebugUnitTest :app:assembleDebug\`)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Reports are attached as the `unit-test-reports` artifact.' >> "$GITHUB_STEP_SUMMARY"
