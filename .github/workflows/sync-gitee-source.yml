name: Sync Gitee source independently
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gitee-source
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Fast-forward isolated source branch, keep metadata main
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: python3 scripts/sync_gitee_source.py
      - if: always()
        env:
          RESULT: ${{ job.status }}
        run: echo "Gitee source · $RESULT. Target github-source; metadata main and APK attachments unchanged." >> "$GITHUB_STEP_SUMMARY"
